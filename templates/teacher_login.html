<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login - SSLD Varshney Engineering College</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0052cc, #002b66);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 35px 30px;
      text-align: center;
    }

    .logo-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      background: #f4f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .college-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-header h2 {
      color: #0d233a;
      font-size: 22px;
      font-weight: 700;
    }

    .college-title {
      color: #0052cc;
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 14px;
      color: #888;
      font-size: 15px;
    }

    .form-control {
      width: 100%;
      height: 46px;
      padding: 10px 14px 10px 42px;
      border: 1.5px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #0052cc;
      box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: #888;
      font-size: 14px;
    }

    .btn-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #0052cc, #003d99);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(0, 82, 204, 0.3);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #003d99, #002b66);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-msg {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 15px;
      display: none;
      font-weight: 600;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
      font-weight: 600;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- College Logo -->
    <div class="logo-container">
      <img src="logo.png" alt="SSLD Logo" class="college-logo">
    </div>

    <div class="login-header">
      <h2>Teacher Login</h2>
      <p class="college-title">SSLD Varshney Engineering College</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">

      <!-- Teacher ID / Username -->
      <div class="form-group">
        <label for="teacherId">Teacher ID / Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="teacherId" class="form-control" placeholder="Enter Teacher ID (e.g. sharma01)" required>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
          <i class="fa-solid fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Login <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
      </button>

      <div class="error-msg" id="errorMsg">
        Invalid Teacher ID or Password!
      </div>
    </form>

    <div class="footer">
      Powered by Jatin & Anshul
    </div>

  </div>

  <script>
    // Backend base URL - agar backend kahin aur host ho to yahan change karo
    const API_URL = 'https://attendance-manager-e3n7.onrender.com';

    // Password Hide/Show Toggle
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Login Form Handler
    async function handleLogin(event) {
      event.preventDefault();

      const teacherId = document.getElementById('teacherId').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';

      if (teacherId === '' || password === '') {
        errorMsg.textContent = 'Please enter Teacher ID and Password!';
        errorMsg.style.display = 'block';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const res = await fetch(`${API_URL}/api/teacher/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: teacherId, password: password })
        });

        const data = await res.json();

        if (data.status === 'success') {
          // FIX: dashboard needs ALL THREE of these keys to know WHICH
          // teacher logged in and to filter attendance to only that
          // teacher's subject. Pehle sirf 'teacherName' save ho raha
          // tha, isi wajah se har teacher ko same/blank portal dikh
          // raha tha (isolation kaam nahi kar rahi thi).
          localStorage.clear();
          localStorage.setItem('teacher_id', data.teacher_id);
          localStorage.setItem('teacher_name', data.name);
          localStorage.setItem('teacher_subject', data.subject);

          window.location.href = 'teacher_dashboard.html';
        } else {
          errorMsg.textContent = data.message || 'Invalid Teacher ID or Password!';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Cannot reach server. Is the backend running?';
        errorMsg.style.display = 'block';
        console.error(err);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>';
      }
    }
  </script>

</body>
</html>
