<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - SSLD Varshney Engineering College</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .college-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .header {
      background-color: #b91c1c;
      color: white;
      text-align: center;
      padding: 20px 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
    }

    .header p {
      font-size: 13px;
      color: #fca5a5;
      margin-top: 4px;
    }

    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .login-card h2 {
      font-size: 20px;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #b91c1c;
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #64748b;
      font-size: 14px;
    }

    .toggle-password:hover {
      color: #0f172a;
    }

    .btn-login {
      width: 100%;
      background-color: #b91c1c;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: #991b1b;
    }

    .btn-login:disabled {
      background-color: #ef4444;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .error-msg {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }

    .extra-links {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
    }

    .extra-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .footer {
      background-color: #b91c1c;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>SSLD Varshney Engineering College</h1>
    <p>Student Portal Login</p>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <img src="logo.png" alt="SSLD Logo" class="college-logo">
      </div>

      <h2>Student Login</h2>
      <p>Enter your Roll Number and Password to access your dashboard.</p>

      <div class="error-msg" id="errorMsg">Invalid Roll Number or Password!</div>

      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="roll">Roll Number / Student ID</label>
          <div class="input-wrapper">
            <input type="text" id="roll" placeholder="e.g. 220101" required autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <i class="fa-solid fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login to Dashboard</button>
      </form>

      <div class="extra-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Need Help?</a>
      </div>
    </div>
  </div>

  <div class="footer">
    Powered by Anshul, Jatin
  </div>

  <script>
    // Password Show/Hide Toggle
function togglePasswordVisibility() {
  const passwordInput = document.getElementById('password');
  const toggleIcon = document.getElementById('togglePassword');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    toggleIcon.classList.remove('fa-eye');
    toggleIcon.classList.add('fa-eye-slash');
  } else {
    passwordInput.type = 'password';
    toggleIcon.classList.remove('fa-eye-slash');
    toggleIcon.classList.add('fa-eye');
  }
}

async function handleLogin(e) {
  e.preventDefault();
  
  const rollInput = document.getElementById('roll');
  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  const roll = rollInput.value.trim();
  const password = passwordInput.value.trim();

  // Frontend 4-digit validation check
  if (!/^\d{4}$/.test(roll)) {
    errorMsg.textContent = 'कृपया केवल 4 अंकों का Roll Number दर्ज करें! (जैसे: 1001)';
    errorMsg.style.display = 'block';
    return;
  }

  errorMsg.style.display = 'none';
  loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
  loginBtn.disabled = true;

  // Localhost test URL
  const API_URL = 'http://127.0.0.1:5000/api/student/login';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json' 
      },
      body: JSON.stringify({ 
        roll_no: roll, 
        password: password 
      })
    });

    const data = await response.json();

    if (response.ok && data.status === 'success') {
      // Name की जगह केवल Roll Number ही local storage में सेव होगा
      localStorage.setItem('student_roll', data.roll_no);
      
      // Redirecting to Student Dashboard
      window.location.href = 'student_dashboard.html';
    } else {
      errorMsg.textContent = data.message || 'Invalid Roll Number or Password!';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    console.error('Fetch Error:', err);
    errorMsg.textContent = 'Backend Connection Error! क्या आपका Flask Server (5000) चल रहा है?';
    errorMsg.style.display = 'block';
  } finally {
    loginBtn.textContent = 'Login to Dashboard';
    loginBtn.disabled = false;
  }
}
  </script>
</body>
</html>
