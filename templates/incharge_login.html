<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Incharge Login</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    }


    body {
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          #b45309,
          #78350f
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }


    .card {
      width: 100%;
      max-width: 430px;

      background: white;

      border-radius: 18px;

      padding: 35px 30px;

      text-align: center;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.22);
    }


    .logo {
      width: 90px;
      height: 90px;

      object-fit: contain;

      background: #f9fafb;

      border-radius: 50%;

      padding: 8px;

      margin-bottom: 15px;
    }


    .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }


    h2 {
      color: #292524;
      font-size: 22px;
    }


    .college {
      color: #b45309;
      font-size: 14px;
      font-weight: 700;

      margin-top: 5px;
      margin-bottom: 25px;
    }


    .group {
      text-align: left;
      margin-bottom: 18px;
    }


    label {
      display: block;

      color: #374151;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 6px;
    }


    input {
      width: 100%;
      height: 47px;

      border: 1.5px solid #d1d5db;

      border-radius: 8px;

      padding: 10px 13px;

      font-size: 14px;

      outline: none;
    }


    input:focus {
      border-color: #d97706;

      box-shadow:
        0 0 0 3px
        rgba(217,119,6,0.12);
    }


    .login {
      width: 100%;
      height: 47px;

      border: none;
      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #d97706,
          #b45309
        );

      color: white;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;
    }


    .login:disabled {
      opacity: .7;
    }


    .error {
      display: none;

      margin-top: 14px;

      color: #dc2626;

      font-size: 13px;
      font-weight: 700;
    }


    .back {
      display: block;

      margin-top: 20px;

      color: #b45309;

      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
    }


    .footer {
      margin-top: 20px;

      padding-top: 15px;

      border-top:
        1px solid #eee;

      color: #777;

      font-size: 12px;
    }

  </style>

</head>


<body>


  <div class="card">


    <img
      src="logo.png"
      class="logo"
      alt="SSLD Logo"
    >

    <h2>
      Class Incharge / HOD
    </h2>


    <div class="college">
      SSLD Varshney Engineering College
    </div>


    <form onsubmit="login(event)">


      <div class="group">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          required
        >

      </div>


      <div class="group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          required
        >

      </div>


      <button
        type="submit"
        class="login"
        id="loginBtn"
      >
        Login →
      </button>


      <div
        class="error"
        id="error"
      ></div>


    </form>


    <a
      href="index.html"
      class="back"
    >
      ← Back to Portal
    </a>


    <div class="footer">
      Powered by Jatin & Anshul
    </div>


  </div>


  <script>

    const API = 'http://127.0.0.1:5000/api';


    async function login(event) {

      event.preventDefault();


      const username =
        document.getElementById(
          "username"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value.trim();


      const error =
        document.getElementById(
          "error"
        );


      const btn =
        document.getElementById(
          "loginBtn"
        );


      error.style.display =
        "none";


      btn.disabled = true;

      btn.textContent =
        "Logging in...";


      try {

        const response =
          await fetch(
            `${API}/incharge/login`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                username:
                  username,

                password:
                  password

              })
            }
          );


        const data =
          await response.json();


        if (
          response.ok &&
          data.status === "success"
        ) {

          localStorage.clear();


          localStorage.setItem(
            "incharge_id",
            data.incharge_id
          );


          localStorage.setItem(
            "incharge_name",
            data.name
          );


          window.location.href =
            "incharge_dashboard.html";


        } else {

          error.textContent =
            data.message ||
            "Invalid username or password.";

          error.style.display =
            "block";
        }


      } catch (e) {

        error.textContent =
          "Cannot connect to server.";

        error.style.display =
          "block";

      } finally {

        btn.disabled = false;

        btn.textContent =
          "Login →";
      }

    }

  </script>

</body>
</html>
